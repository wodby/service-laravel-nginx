name: laravel-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.9"
title: Nginx (Laravel)


labels:
- laravel

build:
  link: backend
  # Only the docroot belongs in the web server image; the rest of the
  # repository stays with the linked PHP service. The same subdirectory is used
  # on both sides so both images resolve the docroot to the same absolute path.
  copySubdir: "{{settings.docroot}}"

settings:
- name: docroot
  title: Nginx docroot
  default: public
  var: DOCROOT_SUBDIR

configs:
- name: preset
  title: Laravel preset
  filepath: /etc/gotpl/preset/laravel.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/laravel.conf.tmpl
- name: preset
  title: Laravel preset
  filepath: /etc/gotpl/preset/laravel.conf.tmpl
  config: preset.conf.tmpl
  version: '1.25'

volumes:
- name: storage
  from: backend
  title: Storage
  path: /mnt/files

env:
- name: NGINX_VHOST_PRESET
  value: laravel
- name: WODBY_INIT_ACTION
  value: init
